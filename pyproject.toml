####################################################################
# beril-paper-writer-skill — pyproject.toml
#
# Status: v0.6.1 — visible figure captions + docx orchestration.
# See RELEASE_NOTES_v0_6.md for v0.6 changes; prior release notes at
# RELEASE_NOTES_v0_[1-5].md. Mirrors beril-adversarial-skill packaging.
####################################################################

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

# ----------------------------------------------------------------------
# Project metadata
# ----------------------------------------------------------------------

[project]
name = "beril-paper-writer-skill"
version = "0.8.0"
description = "BERIL Paper Writer — drafts ICMJE-conformant scientific manuscripts from BERDL analysis projects, with intercalated gap-fill loops and adversarial-review-driven revision. Distributed as a Claude Code skill."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Arkin Laboratory", email = "aparkin@lbl.gov"},
]

license = {text = "MIT"}

keywords = [
    "bioinformatics",
    "claude-code",
    "beril",
    "kbase",
    "research-observatory",
    "scientific-writing",
    "paper-drafting",
    "icmje",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    # Prevents accidental `twine upload` while repo is private.
    # Remove when going public on PyPI.
    "Private :: Do Not Upload",
]

# ----------------------------------------------------------------------
# Runtime dependencies
# ----------------------------------------------------------------------
#
# Two pure-Python dependencies for the assemble step (pyproject.toml
# version of "self-contained pipx install" — no system binaries).
#
# Everything else (install, configure, state-diff, validators, methods
# extraction) uses stdlib only: argparse, pathlib, shutil, subprocess,
# importlib.resources, hashlib, json, os, re.
#
# Decision history: see DECISIONS.md D-024. Earlier drafts assumed
# `pandoc` as a system dependency for assemble; that requires `apt-get`
# / `brew` access on remote BERIL deployments which we cannot assume.
# `python-docx` is a pure-Python .docx writer (with the lxml C extension
# as a transitive dependency, widely available as a wheel on every
# platform we care about). We write a small markdown→docx converter
# on top in tools/assemble_docx.py.

dependencies = [
    "python-dotenv>=1.0.0",
    # Pure-Python .docx writer. Pulls in `lxml` transitively (precompiled
    # wheels are widely available; pipx handles the install).
    "python-docx>=1.1.0",
    # Notebook AST extraction (Phase 2 — methods grounding from .ipynb
    # source). Pure Python, stdlib-only deps.
    "nbformat>=5.7.0",
]

# ----------------------------------------------------------------------
# Optional dependencies (extras)
# ----------------------------------------------------------------------

[project.optional-dependencies]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "build>=1.0.0",
]

# ----------------------------------------------------------------------
# Console scripts
# ----------------------------------------------------------------------

[project.scripts]
beril-paper-writer = "beril_paper_writer.cli:main"

# Planned subcommands (per LAYOUT.md):
#   beril-paper-writer install-skill <BERIL_ROOT>
#   beril-paper-writer configure
#   beril-paper-writer continue <draft_dir>
#   beril-paper-writer assemble <draft_dir>
#
# The drafting and review-rewrite paths are NOT Python subcommands —
# they're handled by the planned shipped shell script
# tools/paper_writer.sh (which the slash command will invoke directly).
# Same pattern as beril-adversarial.

# ----------------------------------------------------------------------
# URLs
# ----------------------------------------------------------------------

[project.urls]
Homepage = "https://github.com/ArkinLaboratory/beril-paper-writer-skill"
Issues = "https://github.com/ArkinLaboratory/beril-paper-writer-skill/issues"
Repository = "https://github.com/ArkinLaboratory/beril-paper-writer-skill.git"

# ----------------------------------------------------------------------
# Build configuration
# ----------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/beril_paper_writer"]

# The shipped skill directory (SKILL.md, prompts, references, tools)
# will live inside the package at src/beril_paper_writer/skill/ and
# ship as package data. Accessed at runtime via importlib.resources.
# Hatchling auto-includes non-.py files in the package; the shell
# script's executable bit is preserved through wheel metadata.
#
# v0.1.0-spec: skill/ tree does not yet exist. Lands with implementation.

[tool.hatch.build.targets.sdist]
include = [
    "src/beril_paper_writer",
    "tests",
    "README.md",
    "SPEC.md",
    "LAYOUT.md",
    "DECISIONS.md",
    "reference",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/.DS_Store",
    # State directories never ship.
    "src/beril_paper_writer/skill/state",
    # Per-draft runtime state never ships either.
    "papers/draft_*/state.json",
    "papers/draft_*/audit",
    "papers/cost-log.jsonl",
]

# ----------------------------------------------------------------------
# Tool configurations
# ----------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
# Make tests find the src-layout package without requiring an
# editable install. A fresh `pytest` from the repo root now works
# without any prior `pip install -e .` step. Diagnosed 2026-05-20
# after Adam's Anaconda-pip / homebrew-pytest interpreter mismatch
# revealed the test suite wasn't self-bootstrapping; the editable
# install is still the right move for running the CLI, but the
# test suite should not depend on it.
pythonpath = ["src"]
markers = [
    "integration: marks tests that hit live LLM CLIs (deselect with '-m \"not integration\"')",
    "slow: marks tests that take >5s",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
]
